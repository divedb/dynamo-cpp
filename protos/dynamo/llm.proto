syntax = "proto3";

package dynamo.llm;

service LLMService {
    rpc Generate(GenerateRequest) returns (stream GenerateResponse);
}

message GenerateRequest {
    string model = 1;
    repeated int32 input_ids = 2 [packed = true];
    GenerationParams params = 3;
    map<string, string> context = 4;
}

message GenerationParams {
    int32 max_tokens = 1;
    float temperature = 2;
    float top_p = 3;
    int32 top_k = 4;
    int32 seed = 5;
    bool stream = 6;
    repeated int32 stop_token_ids = 7 [packed = true];
    int32 min_tokens = 8;
}

message GenerateResponse {
    string request_id = 1;
    int32 token_id = 2;
    float logprob = 3;
    bool finished = 4;
    string finish_reason = 5;
    int32 generated_tokens = 6;
}
